<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Emerald to Forest Teal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="50%" stop-color="#0d4a28" />
      <stop offset="100%" stop-color="#072b17" />
    </linearGradient>

    <!-- Celestial Gold Ring Accent -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Torso Jacket Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Ambient Aura Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Circular Outer Boundary with Shadow Base -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldRing)" stroke-width="2.5" />

  <!-- 2. Ambient Halo Glow in Background -->
  <circle cx="64" cy="50" r="38" fill="url(#auraGlow)" />

  <!-- 3. Islamic Star Octagon / Geometry Watermark (Subtle watermark at 12% opacity) -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.2" fill="none">
    <rect x="36" y="36" width="56" height="56" rx="8" />
    <rect x="36" y="36" width="56" height="56" rx="8" transform="rotate(45 64 64)" />
  </g>

  <!-- 4. Torso / Shoulder Silhouette (Modern Friendly Attire) -->
  <path d="M22 120 C22 96 40 84 64 84 C88 84 106 96 106 120 Z" fill="url(#jacketGrad)" opacity="0.95" />
  <!-- Inner Lapel / Shirt V-Neck (Clean White) -->
  <path d="M52 84 L64 104 L76 84 Z" fill="#ffffff" />
  <path d="M57 84 L64 96 L71 84 Z" fill="#e0e7ff" />

  <!-- 5. Neck -->
  <rect x="56" y="66" width="16" height="22" rx="6" fill="#fde68a" />
  <path d="M56 78 C60 82 68 82 72 78 Z" fill="#f59e0b" opacity="0.4" />

  <!-- 6. Head Silhouette (Warm Friendly Golden-Cream Tone) -->
  <circle cx="64" cy="50" r="23" fill="#fef3c7" />

  <!-- 7. Modern Minimalist Hair / Songkok Peci (Sleek Black Silhouette with Emerald Touch) -->
  <path d="M41 47 C41 28 50 24 64 24 C78 24 87 28 87 47 C87 36 78 30 64 30 C50 30 41 36 41 47 Z" fill="#1e293b" />
  <!-- Songkok Accent Badge (Gold Crescent Sparkle) -->
  <circle cx="64" cy="27" r="2.5" fill="#fbbf24" />

  <!-- 8. Friendly Facial Features (Modern Geometric Minimalist) -->
  <!-- Left Eye -->
  <ellipse cx="55.5" cy="49" rx="2" ry="2.8" fill="#1e293b" />
  <!-- Right Eye -->
  <ellipse cx="72.5" cy="49" rx="2" ry="2.8" fill="#1e293b" />
  <!-- Catchlight in Eyes -->
  <circle cx="56.2" cy="48" r="0.8" fill="#ffffff" />
  <circle cx="73.2" cy="48" r="0.8" fill="#ffffff" />

  <!-- Subtle Cheerful Smile -->
  <path d="M58 56 Q64 61 70 56" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Soft Rosy Cheeks -->
  <circle cx="50" cy="53" r="3.5" fill="#f43f5e" opacity="0.25" />
  <circle cx="78" cy="53" r="3.5" fill="#f43f5e" opacity="0.25" />

  <!-- 9. Floating Guest Star Badge (Bottom Right Pin) -->
  <g transform="translate(86, 86)">
    <circle cx="14" cy="14" r="14" fill="#0f5132" stroke="#fbbf24" stroke-width="1.8" />
    <path d="M14 6 L16.5 11 L22 11.8 L18 15.6 L19 21 L14 18.2 L9 21 L10 15.6 L6 11.8 L11.5 11 Z" fill="#fbbf24" />
  </g>
</svg>
